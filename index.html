<!doctype html>

<title>Galería del taller</title>

<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --borde: #2a2f3b; --texto: #e8eaf0; --suave: #a1aabb;
    --acento: #ff7a3c; --ok: #3ec97a; --medio: #f2b84a; --bajo: #e8604f; --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.45; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--acento); }
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(15,17,21,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 14px 20px 0; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--suave); font-size: 13px; margin: 0 0 10px; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--suave); font-weight: 600; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--acento); }
  nav.tabs button:focus-visible, .chip:focus-visible, .btn:focus-visible, .tarjeta:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .badge-n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--acento); color: #1a1008; font-size: 12px; text-align: center; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px; }
  .filtros { display: grid; gap: 10px; margin-bottom: 18px; }
  .fila-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fila-f .et { color: var(--suave); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; min-width: 72px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--borde); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--panel2); border-color: var(--acento); }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; }
  .tarjeta:hover { border-color: #3a4152; }
  .poster { position: relative; aspect-ratio: 9 / 16; background: #000; overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(transparent 55%, rgba(0,0,0,0.0)); }
  .play span { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.85); display: grid; place-items: center; }
  .play span::after { content: ""; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
  .estrella { position: absolute; top: 10px; right: 10px; padding: 4px 9px; border-radius: 999px; background: var(--acento); color: #1a1008; font-size: 12px; font-weight: 700; }
  .cuerpo { padding: 12px 14px 14px; display: grid; gap: 7px; }
  .cuerpo h3 { margin: 0; font-size: 15px; line-height: 1.25; }
  .cuenta { color: var(--suave); font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--panel2); border: 1px solid var(--borde); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metricas { color: var(--suave); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .fact { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .fact.alta { color: var(--ok); background: rgba(62,201,122,0.12); }
  .fact.media { color: var(--medio); background: rgba(242,184,74,0.12); }
  .fact.baja { color: var(--bajo); background: rgba(232,96,79,0.12); }
  .vacio { color: var(--suave); padding: 40px 0; text-align: center; }
  /* modal */
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 50; display: none; overflow-y: auto; padding: 24px 16px; }
  .velo.abierto { display: block; }
  .modal { max-width: 1040px; margin: 0 auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 18px; display: grid; grid-template-columns: minmax(240px, 400px) 1fr; gap: 0; overflow: hidden; }
  .modal .izq { background: #000; display: flex; align-items: center; justify-content: center; }
  .modal video { width: 100%; max-height: 86vh; aspect-ratio: 9/16; background: #000; display: block; }
  .modal .der { padding: 22px 24px; display: grid; gap: 14px; align-content: start; max-height: 92vh; overflow-y: auto; }
  .modal h2 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
  .modal h4 { margin: 0 0 4px; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; }
  .modal p { margin: 0; font-size: 14.5px; }
  .modal ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .cerrar { position: absolute; top: 16px; right: 20px; background: var(--panel2); border: 1px solid var(--borde); width: 38px; height: 38px; border-radius: 50%; font-size: 20px; line-height: 1; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { background: var(--panel2); border: 1px solid var(--borde); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .btn.primario { background: var(--acento); border-color: var(--acento); color: #1a1008; }
  .btn[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); }
  .btn.primario[aria-pressed="true"] { color: #1a1008; background: #ffb088; }
  .plancha { width: 100%; border-radius: 10px; border: 1px solid var(--borde); display: block; }
  .texto-mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; color: var(--suave); background: var(--panel2); border-radius: 10px; padding: 10px 12px; max-height: 120px; overflow-y: auto; }
  textarea, input[type="text"] { width: 100%; background: var(--panel2); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px; }
  .dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .estilo { display: grid; gap: 8px; }
  .estilo h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .estilo .id { font-weight: 800; color: var(--suave); font-size: 13px; }
  .estilo p { margin: 0; font-size: 14px; }
  .estilo .como { color: var(--suave); font-size: 13px; }
  .mini { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini button { padding: 0; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; width: 54px; aspect-ratio: 9/16; background: #000; }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h2.sec { font-size: 17px; margin: 26px 0 12px; }
  h2.sec:first-child { margin-top: 0; }
  .nota { color: var(--suave); font-size: 13px; }
  .poster.h { aspect-ratio: 16 / 9; }
  .modal.horiz { grid-template-columns: minmax(300px, 1.6fr) 1fr; }
  .modal.horiz video { aspect-ratio: 16 / 9; max-height: 70vh; }
  .voz { display: grid; gap: 10px; align-content: start; }
  .voz h3 { margin: 0; font-size: 16px; }
  .voz audio { width: 100%; }
  .voz p { margin: 0; }
  .grid-voz { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  @media (max-width: 760px) {
    .modal { grid-template-columns: 1fr; }
    .modal video { max-height: 60vh; }
    .modal .der { max-height: none; }
    main { padding: 14px; }
  }
</style>
</head>

<script id="datos" type="application/json">{"generado":"12/11/2026","visual":[{"id":"V1","nombre":"Diorama 3D explicativo","color":"#ff7a3c","desc":"Maqueta 3D en corte (casa, cocina, bodega) que se transforma mientras la voz explica. Cámara casi continua o con cortes por paso, subtítulos arriba, gráficos de datos abajo.","como":"Three.js dentro de HyperFrames + voz local (Kokoro) + tiempos por palabra (Parakeet). Ya hecho en M01-M04.","factibilidad":"alta","esfuerzo":"medio (una maqueta nueva por tema)"},{"id":"V2","nombre":"Muñecos 3D (diálogo o presentador)","color":"#ffc83c","desc":"Personajes low-poly o de cubos, tipo juego: conversan en un escenario (supermercado, bus, cabaña) o un presentador habla a cámara en una oficina con iconos que flotan. Muchos usan cámara en primera persona con manos en pantalla y lente ojo de pez; subtítulos con el nombre del que habla o la palabra clave resaltada.","como":"Three.js: muñecos armados con primitivas, boca que abre y cierra con los tiempos de cada palabra, cámara con fov amplio. Voces: Kokoro solo tiene 3 en español (em_alex, em_santa, ef_dora); se pueden variar con velocidad y tono.","factibilidad":"alta","esfuerzo":"medio-alto (personajes y escenarios por historia)"},{"id":"V3","nombre":"3D cinematográfico oscuro","color":"#b14a3a","desc":"Muñecos de bloques con luz dramática de velas y noche, planos cerrados de rostros, grano y borde de cámara. Subtítulos pequeños al pie.","como":"Three.js con luces cálidas, niebla y viñeta; las expresiones de rostro son el límite. Se puede acercar, pero con más trabajo de iluminación.","factibilidad":"media","esfuerzo":"alto"},{"id":"V4","nombre":"Ilustración 2D oscura tipo animación","color":"#4a76b8","desc":"Ilustraciones de personajes estilizados en azul noche, con pantallas de celular, alertas y datos como recurso narrativo, y pequeños movimientos de cámara sobre imagen fija.","como":"Requiere imágenes generadas: ComfyUI local (Flux/SDXL) cuando haya espacio en disco. La consistencia del personaje es el reto. Las pantallas de celular y los textos sí son nuestros (HTML).","factibilidad":"baja ahora","esfuerzo":"alto (depende de ComfyUI)"},{"id":"V5","nombre":"Cómic / novela gráfica con HUD de datos","color":"#3fa58a","desc":"Ilustraciones detalladas con contorno de tinta y paleta verde-naranja, cortes cada ~3 s, y paneles de datos superpuestos (contadores, \"DÍA 14\", \"DATO REAL\").","como":"Igual que V4 para las imágenes (ComfyUI). El HUD, los contadores y las etiquetas son HTML/GSAP: eso ya lo sabemos hacer.","factibilidad":"baja ahora","esfuerzo":"alto (depende de ComfyUI)"},{"id":"V6","nombre":"Explicativo vectorial plano con presentador","color":"#f2d9a0","desc":"Fondo crema tipo papel, íconos y tarjetas de interfaz que entran uno tras otro, un presentador caricaturesco abajo a la derecha y subtítulos arriba con la palabra clave en amarillo. Ritmo muy rápido.","como":"SVG/HTML + GSAP en HyperFrames (hay muchos bloques de tarjetas e íconos en su registro). Presentador dibujado en SVG con boca sincronizada.","factibilidad":"alta","esfuerzo":"bajo-medio"},{"id":"V7","nombre":"Tutorial en pantalla oscura","color":"#2fb36e","desc":"Modo oscuro con maquetas de celular, chats, código y tablas, llamadas numeradas (1, 2, 3) que señalan cada parte, y subtítulos arriba. Al final, una foto real.","como":"HTML puro: chats, JSON, tablas y círculos numerados con GSAP. HyperFrames trae bloques de chat y código.","factibilidad":"alta","esfuerzo":"bajo"},{"id":"V8","nombre":"Héroe 3D iluminado + fichas de expediente","color":"#e0b04a","desc":"Un objeto o figura 3D con luz dorada, o una celda de contención en 3D monocromo con cotas, láseres y contadores, más fichas de archivo con barras negras de censura que se llenan según avanza el relato.","como":"El objeto 3D necesita un modelo; con primitivas y luz se logra una versión abstracta. Las fichas son HTML.","factibilidad":"media","esfuerzo":"medio"},{"id":"V9","nombre":"3D low-poly estilo anime (PS1)","color":"#e0607a","desc":"Personajes 3D de baja resolución con caras de anime, texturas pixeladas y primeros planos muy cerrados en un escenario único (un ascensor). Subtítulos con tipografía pixel y música de fondo.","como":"Three.js con render a baja resolución y texturas pixeladas; lo difícil son los rostros expresivos. El escenario único y el diálogo son baratos.","factibilidad":"media","esfuerzo":"alto (rostros y animación de personajes)"},{"id":"V10","nombre":"Animación 2D vectorial (personaje o diagramas)","color":"#b07ad8","desc":"Motion graphics 2D de formas planas y paleta cerrada: un personaje de palitos que vive escenas con metáforas, o el corte transversal de un objeto cotidiano con cotas, etiquetas y líneas de tiempo. Mucho cambio de escena.","como":"SVG/HTML + GSAP en HyperFrames. Personaje y objetos dibujados en código; el diagrama animado de un objeto es la versión 2D de nuestros dioramas.","factibilidad":"alta","esfuerzo":"medio (muchas escenas e ilustraciones; los diagramas son fáciles)"},{"id":"V11","nombre":"Objeto 3D con interfaz HUD (showcase)","color":"#2fc4e0","desc":"Un objeto 3D (un producto, una pieza impresa) que la cámara recorre de cerca, con interfaz tipo holograma cian, etiquetas de componentes y titulares en mayúscula con la palabra clave resaltada.","como":"Three.js: importar el modelo (STL o GLB) o armarlo con primitivas; el HUD y las etiquetas son HTML. Con los STL de tu impresora 3D se puede mostrar el proyecto real.","factibilidad":"media","esfuerzo":"medio (preparar el modelo)"},{"id":"V12","nombre":"Infografía editorial de noticias","color":"#e8402a","desc":"Fondo claro con tipografía condensada negra y roja, tarjetas y ventanas de terminal que entran en secuencia, una cifra gigante, la fuente citada al pie, el nivel de gravedad en el encabezado y subtítulos en cajas oscuras. Unos 2 s por plano.","como":"HTML + GSAP en HyperFrames (tiene bloques de tarjetas, contadores y terminal). No necesita 3D ni imágenes generadas.","factibilidad":"alta","esfuerzo":"bajo"},{"id":"V13","nombre":"3D estilizado tipo peluche (personajes de diálogo)","color":"#f2a33a","desc":"Personajes 3D redondeados con aspecto de peluche o fieltro, con ojos grandes y expresivos, sobre escenarios de juguete muy coloridos. Cámara fija o con paneos suaves y planos de reacción cortos (unos 2,4 s).","como":"Three.js con las mismas primitivas redondeadas de V2 (esferas, cápsulas) y materiales mate; el diálogo va con la voz y la boca con movimiento simple. Personajes propios, no los de terceros.","factibilidad":"media","esfuerzo":"medio (armar los personajes una vez)"}],"narrativa":[{"id":"N1","nombre":"Explicativo de curiosidad","color":"#ff7a3c","desc":"Pregunta local → mecanismo explicado con objetos → remate con humor. Gancho alarmante en la primera frase.","como":"Ya dominado (M01-M04). Cada video con idea propia: encaja con la política de YouTube contra el contenido de plantilla.","ideal":"Educación, marca personal, canales de datos curiosos."},{"id":"N2","nombre":"Serie con decisión del público","color":"#ffc83c","desc":"\"PARTE n\" + cliffhanger + pantalla final \"¿Qué hacés?\" con 2 opciones y \"comentá…\". La opción más votada decide la siguiente parte.","como":"Guion en partes de 60-140 s; cada una termina en una decisión. Pide planificar varias ramas.","ideal":"Crecer comentarios y seguidores con ficción corta."},{"id":"N3","nombre":"Ficción seriada de terror o supervivencia","color":"#b14a3a","desc":"Capítulos con narrador en segunda persona (\"tú\") o diálogo, cliffhanger, tensión sostenida. Algunos cierran enviando a la película completa en YouTube.","como":"Guion serial + escenas. Cuidar la política de YouTube: cada capítulo con historia propia, no plantilla repetida.","ideal":"Retención y embudo hacia videos largos."},{"id":"N4","nombre":"Lore / expediente desclasificado","color":"#e0b04a","desc":"Narración como archivo secreto (clase, nivel, hallazgos), fichas con datos que se van revelando y barras negras de <script>

  function metricas(m) {
    var a = [];

    var l = fmtLikes(m.likes); if (l) a.push(l);
    return a;
  }

  document.getElementById('sub').textContent = D.publico ? 'Elige estilo, voz y duración para un video y copia el mensaje desde “Mi elección” · actualizado ' + D.generado : 'Referencias para elegir estilo y videos generados · actualizado ' + D.generado + ' · todo local: los videos no salen de tu PC';

  /* ---------- pestañas ---------- */

  function pintaTabs() {

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;

  /* ---------- referencias ---------- */

  }

  function pintaEstilos() {
    return '<h2 class="sec">Estilos visuales (cómo se ve)</h2><div class="dos">' + D.visual.map(function (x) { return bloqueEstilo(x, 'v'); }).join('') + '</div>' +
      '<h2 class="sec">Estilos narrativos (cómo se cuenta)</h2><div class="dos">' + D.narrativa.map(function (x) { return bloqueEstilo(x, 'n'); }).join('') + '</div>' +
      '<p class="nota" style="margin-top:18px">Los dos ejes se combinan: por ejemplo V2 + N2 es una serie con muñecos 3D que termina pidiendo una decisión.</p>';
  }

  /* ---------- voces ---------- */
  function todasVoces() { return D.voces.concat(D.otrasVoces); }
  function nombreVoz(id) {
    var x = todasVoces().filter(function (v) { return v.id === id; })[0];

  }
  function vocesElegidasHTML() {
    var a = [];
    if (S.voz.principal) a.push('<span class="tag">Principal · ' + esc(nombreVoz(S.voz.principal)) + '</span>');

  }

    var p = S.voz.principal === id, s = S.voz.segunda === id;

  }
  function tarjetaVoz(v) {
    var ajuste = [v.velocidad + '×'].concat(v.tono ? [(v.tono > 0 ? '+' : '') + v.tono + ' semitonos'] : []).join(' · ');
    return '<div class="panel voz"><h3>' + esc(v.nombre) + '</h3><div class="tags"><span class="tag">' + esc(v.genero) + '</span><span class="tag">' + esc(ajuste) + '</span></div>' +

  }
  function pintaVoces() {
    var vis = function (v) { return S.vocesOcultas.indexOf(v.id) < 0; };
    var base = D.voces.filter(vis).filter(function (v) { return v.id === v.base; }), vars = D.voces.filter(vis).filter(function (v) { return v.id !== v.base; });
    return '<h2 class="sec">Voces para elegir</h2>' +
      '<p class="nota">Todas dicen el mismo texto y salen al mismo volumen: “' + esc(D.textoVoz) + '”</p>' +
      '<p class="nota">' + esc(D.motorVoz) + ' Elige una <strong>voz principal</strong> (narrador) y, si el video tiene diálogo, una <strong>segunda voz</strong>.</p>' +
      '<h2 class="sec">Voces base</h2><div class="grid-voz">' + base.map(tarjetaVoz).join('') + '</div>' +
      '<h2 class="sec">Variantes (otro tono u otra velocidad)</h2><div class="grid-voz">' + vars.map(tarjetaVoz).join('') + '</div>' +
      '<h2 class="sec">Otras opciones</h2><div class="grid-voz">' + D.otrasVoces.filter(vis).map(function (v) {
        return '<div class="panel voz"><h3>' + esc(v.nombre) + '</h3><p class="nota">' + esc(v.desc) + '</p>' + botonesVoz(v.id) + '</div>';
      }).join('') + '</div>' + descartadasHTML();
  }

  /* ---------- mis videos ---------- */
  /* ---------- costo y complejidad ---------- */
  function nf(x, d) { return Number(x).toLocaleString('es-PE', { maximumFractionDigits: d == null ? 2 : d }); }
  var CO = (D.costos || {}), COV = D.mios.filter(function (x) { return x.costo; });
  var PROM = COV.length ? COV.reduce(function (a, x) { return a + x.costo.unidades; }, 0) / COV.length : 0;
  var TOTALCO = COV.reduce(function (a, x) { return a + x.costo.unidades; }, 0);
  function nivelGasto(u) { return u < PROM * 0.7 ? ['bajo', 'alta'] : u > PROM * 1.3 ? ['alto', 'baja'] : ['medio', 'media']; }
  function pctLimite(u) { var k = CO.calibracion && CO.calibracion.unidadesPorPorcentaje; return k ? u / k : null; }
  function costoChip(v) {
    if (!v.costo) return '';
    var n = nivelGasto(v.costo.unidades), p = pctLimite(v.costo.unidades);
    return ' · <span class="fact ' + n[1] + '" title="' + esc(v.costo.motivo) + '">Complejidad ' + esc(v.costo.complejidad) + '</span> <span class="fact ' + n[1] + '">Gasto ' + n[0] + (v.costo.estimado ? ' (est.)' : '') + (p != null ? ' · ' + nf(p, 1) + ' % del límite' : '') + '</span>';
  }
  function costoBloque(v) {
    var c = v.costo, id = v.id;
    if (!c && D.publico) return '';
    if (!c) return '<div><h4>Costo y complejidad</h4><p class="nota">Sin medir todavía. Se mide con el transcript de la sesión (ver aprendizaje/costo-por-video.md).</p></div>';
    var n = nivelGasto(c.unidades), rel = PROM ? c.unidades / PROM : 1, p = pctLimite(c.unidades);
    var puntos = '●●●●●'.slice(0, c.puntos) + '○○○○○'.slice(0, 5 - c.puntos);
    var imp = S.impacto[id] || '', impN = parseFloat(String(imp).replace(/\./g, '').replace(',', '.'));
    var rend = isFinite(impN) && impN > 0 ? nf(impN / c.unidades, 1) + ' de impacto por cada millón de unidades gastadas' : 'Anota tu impacto y verás el rendimiento.';
    return '<div><h4>Costo y complejidad</h4>' +
      '<p><span class="fact ' + n[1] + '">Complejidad ' + esc(c.complejidad) + ' ' + puntos + '</span> <span class="fact ' + n[1] + '">Gasto ' + n[0] + '</span></p>' +
      '<p class="nota" style="margin-top:8px">' + esc(c.motivo) + '</p>' +
      '<div class="metricas" style="margin-top:8px">' + nf(c.unidades) + ' M unidades' + (c.estimado ? ' (promedio de 3 videos)' : '') + ' · ' + nf(rel, 1) + '× el promedio · ' + nf(100 * c.unidades / TOTALCO, 0) + ' % del gasto de los ' + COV.length + ' videos medidos · modelo ' + esc(c.modelo) + '</div>' +
      '<p class="nota" style="margin-top:6px">% del límite de 5 h: ' + (p != null ? '<b>' + nf(p, 1) + ' %</b>' : 'sin calibrar (el límite no se puede leer desde aquí; ver nota abajo)') + '</p>' +
      '<p class="nota">' + esc(c.reutil) + '</p></div>' +
      '<div><h4>Impacto y rendimiento</h4><label><span class="nota">Impacto que mides (vistas, me gusta, clientes… un número)</span><input type="text" id="impacto" data-id="' + esc(id) + '" inputmode="decimal" placeholder="Ej.: 12500" value="' + esc(imp) + '"></label>' +
      '<p id="rend" style="margin-top:8px"><b>' + rend + '</b></p>' +
      '<p class="nota" style="margin-top:6px">' + esc(CO.nota || '') + '</p></div>';
  }
  var VAL = { ok: 'Me gusta', pulir: 'Pulir', no: 'No me gusta' };
  function tarjetaMio(v) {
    var val = S.valor[v.id] ? '<span class="estrella" style="background:var(--panel2);color:var(--texto);border:1px solid var(--borde)">' + esc(VAL[S.valor[v.id]]) + '</span>' : '';
    return '<button class="tarjeta" data-mio="' + esc(v.id) + '"><div class="poster"><img loading="lazy" src="' + esc(v.poster) + '" alt=""><div class="play"><span></span></div>' + val + '</div>' +
      '<div class="cuerpo"><h3>' + esc(v.titulo) + '</h3><div class="cuenta">' + esc(v.tipo) + '</div>' +
      '<div class="metricas">' + esc(Math.round(v.duracion) + ' s' + (v.voz ? ' · voz ' + v.voz : '') + (v.lufs != null ? ' · ' + v.lufs + ' LUFS' : '')) + costoChip(v) + '</div></div></button>';
  }
  function pintaMios() {
    return '<h2 class="sec">Videos generados en el taller</h2><div class="grid">' + D.mios.map(tarjetaMio).join('') + '</div>' +
      '<p class="nota" style="margin-top:16px">Toca uno para verlo y dejar tu opinión: queda guardada en este navegador y se copia en “Mi elección”.</p>';
  }

  /* ---------- mi elección ---------- */
  function mensaje() {
    var l = [];
    var v = S.estV.map(function (i) { return i + ' (' + V[i].nombre + ')'; }).join(' + ');
    var n = S.estN.map(function (i) { return i + ' (' + N[i].nombre + ')'; }).join(' + ');
    l.push('Quiero un video con estilo visual: ' + (v || '(sin elegir)') + ' y narrativa: ' + (n || '(sin elegir)') + '.');
    if (S.favs.length) l.push('Referencias que me gustan: ' + S.favs.map(function (i) { return RID[i] ? RID[i].titulo + ' (' + RID[i].cuenta + ')' : i; }).join('; ') + '.');
    l.push(S.tema ? 'Tema: ' + S.tema + '.' : 'Tema: sin definir (pregúntame).');
    if (!S.voz.principal && !S.voz.segunda) l.push('Voz: voz no seleccionada (pregúntame cuál usar).');
    else l.push('Voz: ' + (S.voz.principal ? 'principal ' + nombreVoz(S.voz.principal) : '') + (S.voz.segunda ? (S.voz.principal ? '; ' : '') + 'segunda (diálogo) ' + nombreVoz(S.voz.segunda) : '') + '.');
    l.push(S.dur ? 'Duración: ' + S.dur + ' segundos.' : 'Duración: no seleccionada (pregúntame cuál usar).');
    var op = D.mios.filter(function (x) { return S.valor[x.id] || S.notas[x.id]; }).map(function (x) { return '- ' + x.titulo + ': ' + (VAL[S.valor[x.id]] || 'sin valorar') + (S.notas[x.id] ? ' — ' + S.notas[x.id] : ''); });
    if (op.length) l.push('Opinión sobre los videos hechos:\n' + op.join('\n'));
    if (S.extra) l.push('Notas: ' + S.extra);
    return l.join('\n');
  }
  function pintaEleccion() {
    var combo = (S.estV.length || S.estN.length);
    return '<div class="dos"><div class="panel" style="display:grid;gap:12px"><h2 class="sec" style="margin:0">Tu elección</h2>' +
      '<div><h4 class="nota">Visual</h4><div class="tags">' + (S.estV.length ? S.estV.map(function (i) { return tagHTML(V[i]); }).join('') : '<span class="nota">Sin elegir (pestaña Estilos).</span>') + '</div></div>' +
      '<div><h4 class="nota">Narrativa</h4><div class="tags">' + (S.estN.length ? S.estN.map(function (i) { return tagHTML(N[i]); }).join('') : '<span class="nota">Sin elegir.</span>') + '</div></div>' +
      '<div><h4 class="nota">Referencias que te gustan</h4><div class="mini">' + (S.favs.length ? S.favs.map(function (i) { return RID[i] ? '<button data-ref="' + esc(i) + '" title="' + esc(RID[i].titulo) + '"><img src="' + esc(RID[i].poster) + '" alt=""></button>' : ''; }).join('') : '<span class="nota">Ninguna todavía.</span>') + '</div></div>' +
      '<div><h4 class="nota">Voz</h4><div class="tags">' + (S.voz.principal || S.voz.segunda ? vocesElegidasHTML() : '<span class="tag" style="opacity:.75">Voz no seleccionada (pestaña Voces)</span>') + '</div></div>' +
      '<label><span class="nota">Duración</span><select id="dur"><option value="">Duración no seleccionada</option>' + [15, 30, 45, 60, 90].map(function (d) { return '<option value="' + d + '"' + (String(S.dur) === String(d) ? ' selected' : '') + '>' + d + ' segundos</option>'; }).join('') + '</select></label>' +
      '<label><span class="nota">Tema del video</span><input type="text" id="tema" placeholder="Ej.: por qué los micros de Lima tienen esos colores" value="' + esc(S.tema) + '"></label>' +
      '<label><span class="nota">Notas</span><textarea id="extra" placeholder="Cosas que quieres o que no (la voz y la duración van arriba)">' + esc(S.extra) + '</textarea></label></div>' +
      '<div class="panel" style="display:grid;gap:12px;align-content:start"><h2 class="sec" style="margin:0">Mensaje para pegarme</h2>' +
      '<p class="nota">' + (D.publico ? 'Copia este texto y mándaselo a Francisco: dice qué estilo, voz y duración quieres.' : 'Copia este texto y pégalo en el chat cuando quieras el video: me dice qué estilo usar.') + '</p>' +
      '<textarea id="msg" readonly style="min-height:220px">' + esc(mensaje()) + '</textarea>' +
      '<div class="acciones"><button class="btn primario" id="copiar">Copiar mensaje</button><button class="btn" id="limpiar">Borrar mi elección</button></div><div class="nota" id="aviso"></div></div></div>';
  }

  /* ---------- modal ---------- */
  var velo = document.getElementById('velo'), modal = document.getElementById('modal');
  function abre(html, cls) { modal.className = 'modal' + (cls ? ' ' + cls : ''); modal.innerHTML = html; velo.classList.add('abierto'); document.body.style.overflow = 'hidden'; }
  function cierra() { var v = modal.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } modal.innerHTML = ''; velo.classList.remove('abierto'); document.body.style.overflow = ''; }
  document.getElementById('cerrar').addEventListener('click', cierra);
  velo.addEventListener('click', function (e) { if (e.target === velo) cierra(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && velo.classList.contains('abierto')) cierra(); });

  function modalRef(id) {
    var r = RID[id]; if (!r) return;
    var fav = S.favs.indexOf(id) >= 0;
    var tags = r.visual.map(function (i) { return tagHTML(V[i]); }).concat(r.narrativa.map(function (i) { return tagHTML(N[i]); })).join('');
    var m = metricas(r.metricas).join(' · ');
    var fact = V[r.visual[0]].factibilidad;
    var cls = fact.indexOf('alta') === 0 ? 'alta' : fact.indexOf('media') === 0 ? 'media' : 'baja';
    abre('<div class="izq">' + (r.video ? '<video controls playsinline preload="metadata" poster="' + esc(r.poster) + '" src="' + esc(r.video) + '"></video>' : '<a href="' + esc(r.url) + '" target="_blank" rel="noopener"><img src="' + esc(r.poster) + '" alt="" style="width:100%;display:block"></a><p class="nota" style="margin-top:8px">Míralo en el original (botón “Ver original”).</p>') + '</div>' +
      '<div class="der"><div><h2>' + esc(r.titulo) + '</h2><div class="cuenta">' + esc(r.cuenta) + ' · ' + esc(r.plataforma) + (r.idioma === 'en' ? ' · en inglés' : '') + (r.metricas.fecha ? ' · ' + esc(r.metricas.fecha) : '') + '</div></div>' +
      '<div class="tags">' + tags + '</div><div class="metricas">' + esc(m) + '</div>' +
      '<div class="acciones"><button class="btn primario" data-fav="' + esc(id) + '" aria-pressed="' + fav + '">' + (fav ? '★ Me gusta' : '☆ Me gusta esta referencia') + '</button>' +
      '<button class="btn" data-usar="' + esc(id) + '">Usar su estilo</button><a class="btn" href="' + esc(r.url) + '" target="_blank" rel="noopener">Ver original</a></div>' +
      '<div><h4>De qué trata</h4><p>' + esc(r.resumen) + '</p></div>' +
      '<div><h4>Gancho</h4><p>' + esc(r.gancho) + '</p></div><div><h4>Cierre</h4><p>' + esc(r.cierre) + '</p></div>' +
      '<div><h4>Recursos que usa</h4><ul>' + r.recursos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div><h4>Para nosotros</h4><p><span class="fact ' + cls + '">Factibilidad ' + esc(fact) + '</span> ' + esc(r.encaje) + '</p></div>' +
      (r.plancha ? '<div><h4>Fotogramas (uno cada ' + esc(r.metricas.pasoPlancha || '') + ' s)</h4><a href="' + esc(r.plancha) + '" target="_blank"><img class="plancha" loading="lazy" src="' + esc(r.plancha) + '" alt="Plancha de fotogramas"></a></div>' : '') +
      (r.metricas.texto ? '<div><h4>Lo que dice (transcripción automática)</h4><div class="texto-mono">' + esc(r.metricas.texto) + '</div></div>' : '') + '</div>', esH(r) ? 'horiz' : '');
  }
  function modalMio(id) {
    var v = D.mios.filter(function (x) { return x.id === id; })[0]; if (!v) return;
    var val = S.valor[id] || '';
    abre('<div class="izq"><video controls playsinline preload="metadata" poster="' + esc(v.poster) + '" src="' + esc(v.video) + '"></video></div>' +
      '<div class="der"><div><h2>' + esc(v.titulo) + '</h2><div class="cuenta">' + esc(v.tipo) + '</div></div>' +
      '<div class="metricas">' + esc(Math.round(v.duracion) + ' s · ' + v.ancho + '×' + v.alto + (v.voz ? ' · voz ' + v.voz : '') + (v.lufs != null ? ' · ' + v.lufs + ' LUFS' : '')) + '</div>' +
      (v.resumen ? '<div><h4>De qué trata</h4><p>' + esc(v.resumen) + '</p></div>' : '') +
      costoBloque(v) +
      '<div><h4>Tu opinión</h4><div class="acciones">' + Object.keys(VAL).map(function (k) { return '<button class="btn" data-val="' + esc(id) + ':' + k + '" aria-pressed="' + (val === k) + '">' + VAL[k] + '</button>'; }).join('') + '</div></div>' +
      '<div><h4>Qué cambiarías</h4><textarea id="nota-mio" data-id="' + esc(id) + '" placeholder="Voz, ritmo, encuadre, datos…">' + esc(S.notas[id] || '') + '</textarea></div>' +
      (v.guion ? '<div class="nota">Guion y fuentes: ' + esc(v.guion) + '</div>' : '') + '</div>');
  }

  /* ---------- eventos ---------- */
  var main = document.getElementById('main');
  main.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-fv]'))) { alterna(S.fV, t.getAttribute('data-fv')); pinta(); return; }
    if ((t = e.target.closest('[data-fn]'))) { alterna(S.fN, t.getAttribute('data-fn')); pinta(); return; }
    if ((t = e.target.closest('[data-voz-ocultar]'))) { var oid = t.getAttribute('data-voz-ocultar'); if (S.vocesOcultas.indexOf(oid) < 0) S.vocesOcultas.push(oid); if (S.voz.principal === oid) S.voz.principal = ''; if (S.voz.segunda === oid) S.voz.segunda = ''; guardar(); var sy1 = window.scrollY; pinta(); window.scrollTo(0, sy1); return; }
    if ((t = e.target.closest('[data-voz-volver]'))) { var vid = t.getAttribute('data-voz-volver'); S.vocesOcultas = vid === '*' ? [] : S.vocesOcultas.filter(function (x) { return x !== vid; }); guardar(); var sy2 = window.scrollY; pinta(); window.scrollTo(0, sy2); return; }
    if ((t = e.target.closest('[data-voz]'))) { var qv = t.getAttribute('data-voz').split(':'); S.voz[qv[0]] = S.voz[qv[0]] === qv[1] ? '' : qv[1]; guardar(); var sy = window.scrollY; pinta(); window.scrollTo(0, sy); return; }
    if ((t = e.target.closest('[data-ref]'))) { modalRef(t.getAttribute('data-ref')); return; }
    if ((t = e.target.closest('[data-mio]'))) { modalMio(t.getAttribute('data-mio')); return; }
    if ((t = e.target.closest('[data-est]'))) { var p = t.getAttribute('data-est').split(':'); alterna(p[0] === 'v' ? S.estV : S.estN, p[1]); guardar(); pinta(); return; }
    if (e.target.id === 'copiar') {
      var txt = document.getElementById('msg').value, av = document.getElementById('aviso');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { av.textContent = 'Copiado.'; }, function () { var a = document.getElementById('msg'); a.select(); av.textContent = 'Selecciona el texto y copia con Ctrl+C.'; });
      return;
    }
    if (e.target.id === 'limpiar') { S.voz = { principal: '', segunda: '' }; S.favs = []; S.estV = []; S.estN = []; S.tema = ''; S.dur = ''; S.extra = ''; S.notas = {}; S.valor = {}; guardar(); pinta(); }
  });
  main.addEventListener('input', function (e) {
    if (e.target.id === 'tema') S.tema = e.target.value;
    else if (e.target.id === 'extra') S.extra = e.target.value;
    else if (e.target.id === 'dur') S.dur = e.target.value;
    else return;
    guardar(); var a = document.getElementById('msg'); if (a) a.value = mensaje();
  });
  modal.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-fav]'))) { alterna(S.favs, t.getAttribute('data-fav')); guardar(); var id = t.getAttribute('data-fav'), pos = modal.querySelector('video').currentTime; modalRef(id); var vv = modal.querySelector('video'); vv.currentTime = pos; pintaTabs(); return; }
    if ((t = e.target.closest('[data-usar]'))) { var r = RID[t.getAttribute('data-usar')]; S.estV = r.visual.slice(); S.estN = r.narrativa.slice(); guardar(); pintaTabs(); t.textContent = 'Estilo elegido ✓'; return; }
    if ((t = e.target.closest('[data-val]'))) { var q = t.getAttribute('data-val').split(':'); S.valor[q[0]] = S.valor[q[0]] === q[1] ? '' : q[1]; guardar(); var pos2 = modal.querySelector('video').currentTime; modalMio(q[0]); modal.querySelector('video').currentTime = pos2; return; }
  });
  main.addEventListener('play', function (e) { if (e.target.tagName === 'AUDIO') document.querySelectorAll('audio').forEach(function (a) { if (a !== e.target) a.pause(); }); }, true);
  modal.addEventListener('input', function (e) {
    if (e.target.id === 'nota-mio') { S.notas[e.target.getAttribute('data-id')] = e.target.value; guardar(); }
    else if (e.target.id === 'impacto') {
      var vid = e.target.getAttribute('data-id'); S.impacto[vid] = e.target.value; guardar();
      var vv = D.mios.filter(function (x) { return x.id === vid; })[0], r = document.getElementById('rend');
      if (vv && r) { var n = parseFloat(String(e.target.value).replace(/\./g, '').replace(',', '.')); r.innerHTML = '<b>' + (isFinite(n) && n > 0 ? nf(n / vv.costo.unidades, 1) + ' de impacto por cada millón de unidades gastadas' : 'Anota tu impacto y verás el rendimiento.') + '</b>'; }
    }
  });
  velo.addEventListener('click', function (e) { var t = e.target.closest('[data-ref]'); if (t && !modal.contains(t)) modalRef(t.getAttribute('data-ref')); });

  function pinta() {
    pintaTabs();
    main.innerHTML = S.tab === 'refs' ? pintaRefs() : S.tab === 'estilos' ? pintaEstilos() : S.tab === 'voces' ? pintaVoces() : S.tab === 'mios' ? pintaMios() : pintaEleccion();
  }
  pinta();
})();
</script>
</body>
</html>
